<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>LPアナリティクス</title>
<style>
  :root {
    --aurora-1: #00ffc8;
    --aurora-2: #7b5cff;
    --aurora-3: #ff5ce0;
    --ink: #eaf6ff;
    --ink-soft: #94a8c7;
    --bg: #060812;
    --panel: rgba(20, 26, 46, 0.55);
    --panel-border: rgba(140, 200, 255, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--ink);
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: -20%;
    z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 15%, rgba(0, 255, 200, 0.35), transparent 60%),
      radial-gradient(ellipse 55% 45% at 80% 10%, rgba(123, 92, 255, 0.35), transparent 60%),
      radial-gradient(ellipse 60% 50% at 50% 90%, rgba(255, 92, 224, 0.25), transparent 60%),
      linear-gradient(180deg, #05060f 0%, #090b1a 100%);
    filter: blur(40px) saturate(140%);
    animation: auroraDrift 18s ease-in-out infinite alternate;
  }
  @keyframes auroraDrift {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(3%, -4%) rotate(4deg); }
  }
  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 40px 20px 70px; }
  h1 {
    font-size: 21px;
    margin: 0 0 24px;
    font-weight: 700;
    letter-spacing: 0.03em;
    background: linear-gradient(90deg, var(--aurora-1), var(--aurora-2) 55%, var(--aurora-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; gap: 18px; }
  .gate input {
    font-size: 16px;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(16px);
    color: var(--ink);
    width: 220px;
    text-align: center;
    outline: none;
  }
  .gate input:focus { border-color: rgba(0, 255, 200, 0.5); box-shadow: 0 0 0 3px rgba(0, 255, 200, 0.15); }
  .gate input::placeholder { color: var(--ink-soft); }
  .gate button, .range button {
    background: linear-gradient(120deg, var(--aurora-1), var(--aurora-2));
    color: #05060f;
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 255, 200, 0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .gate button:hover, .range button:hover { transform: translateY(-1px); box-shadow: 0 6px 26px rgba(123, 92, 255, 0.35); }
  .gate .err { color: #ff6b8b; font-size: 13px; min-height: 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 18px;
    backdrop-filter: blur(18px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    position: relative;
    overflow: hidden;
  }
  .card::after {
    content: '';
    position: absolute;
    top: -50%; right: -30%;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(0, 255, 200, 0.25), transparent 70%);
    pointer-events: none;
  }
  .card .label { font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; letter-spacing: 0.02em; }
  .card .value {
    font-size: 27px;
    font-weight: 800;
    background: linear-gradient(120deg, #ffffff, var(--aurora-1));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .card .value .unit { font-size: 14px; font-weight: 500; margin-left: 2px; }
  .section {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    backdrop-filter: blur(18px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }
  .section h2 { font-size: 13px; margin: 0 0 16px; color: var(--ink-soft); letter-spacing: 0.04em; text-transform: uppercase; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar {
    width: 100%;
    background: linear-gradient(180deg, var(--aurora-1), var(--aurora-2) 70%, var(--aurora-3));
    border-radius: 6px 6px 2px 2px;
    min-height: 2px;
    box-shadow: 0 0 14px rgba(0, 255, 200, 0.35);
  }
  .bar-date { font-size: 10px; color: var(--ink-soft); margin-top: 8px; white-space: nowrap; }
  .cta-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 10px 2px;
    border-bottom: 1px solid rgba(140, 200, 255, 0.1);
    color: var(--ink);
  }
  .cta-row:last-child { border-bottom: none; }
  .range { display: flex; gap: 10px; margin-bottom: 22px; }
  .range button {
    background: var(--panel);
    color: var(--ink-soft);
    border: 1px solid var(--panel-border);
    padding: 9px 16px;
    font-size: 13px;
    box-shadow: none;
  }
  .range button.active {
    background: linear-gradient(120deg, var(--aurora-1), var(--aurora-2));
    color: #05060f;
    border-color: transparent;
    box-shadow: 0 4px 20px rgba(0, 255, 200, 0.2);
  }
  .hidden { display: none; }
  .loading, .empty { text-align: center; color: var(--ink-soft); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate">
    <h1>🔒 LPアナリティクス</h1>
    <input id="pw" type="password" placeholder="パスワード" autocomplete="off">
    <button onclick="unlock()">表示する</button>
    <div class="err" id="err"></div>
  </div>

  <div id="dash" class="hidden">
    <h1>📊 LPアナリティクス</h1>
    <div class="range" id="rangeButtons"></div>
    <div id="loading" class="loading">読み込み中…</div>
    <div id="content" class="hidden">
      <div class="cards">
        <div class="card"><div class="label">訪問者数</div><div class="value" id="v-visitors">-</div></div>
        <div class="card"><div class="label">ページ表示回数</div><div class="value" id="v-pageviews">-</div></div>
        <div class="card"><div class="label">CTAクリック数</div><div class="value" id="v-clicks">-</div></div>
        <div class="card"><div class="label">クリック率</div><div class="value" id="v-rate">-<span class="unit">%</span></div></div>
        <div class="card"><div class="label">平均滞在時間</div><div class="value" id="v-dwell">-</div></div>
      </div>
      <div class="section">
        <h2>日別 訪問者数</h2>
        <div class="bars" id="bars"></div>
      </div>
      <div class="section">
        <h2>CTAボタン別クリック内訳</h2>
        <div id="ctaList"></div>
      </div>
    </div>
  </div>
</div>

<script>
  var FN_URL = 'https://qgcgkrcrfzonmmygcdju.supabase.co/functions/v1/lp-analytics-summary';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnY2drcmNyZnpvbm1teWdjZGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxOTY3NDcsImV4cCI6MjA5MDc3Mjc0N30.2kTAP333XfchMUpOJQB-Ex44wdj51JqjJR9nyTboBPE';
  var currentDays = 7;
  var password = '';

  function unlock() {
    var pw = document.getElementById('pw').value.trim();
    if (!pw) return;
    password = pw;
    load(currentDays, true);
  }

  document.getElementById('pw').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') unlock();
  });

  function renderRangeButtons() {
    var opts = [{ d: 7, label: '7日間' }, { d: 30, label: '30日間' }, { d: 90, label: '90日間' }];
    var el = document.getElementById('rangeButtons');
    el.innerHTML = '';
    opts.forEach(function (o) {
      var b = document.createElement('button');
      b.textContent = o.label;
      if (o.d === currentDays) b.className = 'active';
      b.onclick = function () { currentDays = o.d; load(currentDays, false); };
      el.appendChild(b);
    });
  }

  function formatDwell(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m > 0 ? (m + '分' + s + '秒') : (s + '秒');
  }

  function load(days, isFirst) {
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('content').classList.add('hidden');
    document.getElementById('err').textContent = '';

    fetch(FN_URL, {
      method: 'POST',
      headers: {
        'apikey': ANON,
        'Authorization': 'Bearer ' + ANON,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ password: password, days: days })
    })
      .then(function (res) {
        if (res.status === 401) throw new Error('unauthorized');
        if (!res.ok) throw new Error('server');
        return res.json();
      })
      .then(function (data) {
        if (isFirst) {
          document.getElementById('gate').classList.add('hidden');
          document.getElementById('dash').classList.remove('hidden');
          renderRangeButtons();
        } else {
          renderRangeButtons();
        }
        render(data);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
      })
      .catch(function (e) {
        if (e.message === 'unauthorized') {
          document.getElementById('err').textContent = 'パスワードが違います';
          document.getElementById('loading').classList.add('hidden');
        } else {
          document.getElementById('loading').textContent = '読み込みに失敗しました。時間をおいて再度お試しください。';
        }
      });
  }

  function render(data) {
    document.getElementById('v-visitors').textContent = data.visitors;
    document.getElementById('v-pageviews').textContent = data.pageviews;
    document.getElementById('v-clicks').textContent = data.ctaClicks;
    document.getElementById('v-rate').innerHTML = data.clickRate + '<span class="unit">%</span>';
    document.getElementById('v-dwell').textContent = formatDwell(data.avgDwellSeconds);

    var bars = document.getElementById('bars');
    bars.innerHTML = '';
    var max = Math.max.apply(null, data.daily.map(function (d) { return d.pageviews; }).concat([1]));
    data.daily.forEach(function (d) {
      var col = document.createElement('div');
      col.className = 'bar-col';
      var bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = Math.max(2, Math.round((d.pageviews / max) * 100)) + '%';
      bar.title = d.date + ': ' + d.pageviews + '件';
      var label = document.createElement('div');
      label.className = 'bar-date';
      label.textContent = d.date.slice(5);
      col.appendChild(bar);
      col.appendChild(label);
      bars.appendChild(col);
    });

    var ctaList = document.getElementById('ctaList');
    ctaList.innerHTML = '';
    var entries = Object.entries(data.ctaBreakdown || {}).sort(function (a, b) { return b[1] - a[1]; });
    if (!entries.length) {
      ctaList.innerHTML = '<div class="empty">まだクリックがありません</div>';
    } else {
      entries.forEach(function (e) {
        var row = document.createElement('div');
        row.className = 'cta-row';
        row.innerHTML = '<span>' + e[0].replace(/</g, '&lt;') + '</span><span>' + e[1] + '回</span>';
        ctaList.appendChild(row);
      });
    }
  }
</script>
</body>
</html>
