<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>LPアナリティクス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --aurora-1: #00ffc8;
    --aurora-2: #7b5cff;
    --aurora-3: #ff5ce0;
    --ink: #eaf6ff;
    --ink-soft: #94a8c7;
    --bg: #060812;
    --panel: rgba(20, 26, 46, 0.55);
    --panel-border: rgba(140, 200, 255, 0.16);
    --track: rgba(140, 200, 255, 0.08);
    --font-jp: "Noto Sans JP", sans-serif;
    --font-num: "Inter", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-jp);
    background: var(--bg);
    color: var(--ink);
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: -20%;
    z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 15%, rgba(0, 255, 200, 0.35), transparent 60%),
      radial-gradient(ellipse 55% 45% at 80% 10%, rgba(123, 92, 255, 0.35), transparent 60%),
      radial-gradient(ellipse 60% 50% at 50% 90%, rgba(255, 92, 224, 0.25), transparent 60%),
      linear-gradient(180deg, #05060f 0%, #090b1a 100%);
    filter: blur(40px) saturate(140%);
    animation: auroraDrift 18s ease-in-out infinite alternate;
  }
  @keyframes auroraDrift {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(3%, -4%) rotate(4deg); }
  }
  .wrap { position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; padding: 36px 48px 60px; }
  .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  h1 {
    font-size: 24px;
    margin: 0;
    font-weight: 700;
    letter-spacing: 0.03em;
    background: linear-gradient(90deg, var(--aurora-1), var(--aurora-2) 55%, var(--aurora-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; gap: 18px; }
  .gate input {
    font-size: 16px;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(16px);
    color: var(--ink);
    width: 220px;
    text-align: center;
    outline: none;
  }
  .gate input:focus { border-color: rgba(0, 255, 200, 0.5); box-shadow: 0 0 0 3px rgba(0, 255, 200, 0.15); }
  .gate input::placeholder { color: var(--ink-soft); }
  .gate button, .range button {
    background: linear-gradient(120deg, var(--aurora-1), var(--aurora-2));
    color: #05060f;
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 255, 200, 0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .gate button:hover, .range button:hover { transform: translateY(-1px); box-shadow: 0 6px 26px rgba(123, 92, 255, 0.35); }
  .gate .err { color: #ff6b8b; font-size: 13px; min-height: 18px; }
  .cards { display: flex; gap: 12px; margin-bottom: 24px; }
  .card {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 16px 14px;
    backdrop-filter: blur(18px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    position: relative;
    overflow: hidden;
  }
  .card::after {
    content: '';
    position: absolute;
    top: -50%; right: -30%;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(0, 255, 200, 0.25), transparent 70%);
    pointer-events: none;
  }
  .card .label { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; line-height: 1.3; }
  .card .value {
    font-family: var(--font-num);
    font-size: 26px;
    font-weight: 700;
    line-height: 1.1;
    background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2) 55%, var(--aurora-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .card .value .unit { font-size: 14px; font-weight: 500; margin-left: 2px; }
  .main-row { display: flex; flex-direction: column; gap: 20px; }
  .section {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(18px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }
  .chart-section { margin-bottom: 20px; }
  .right-col { display: flex; flex-direction: column; gap: 20px; }
  .bottom-row { display: flex; flex-direction: column; gap: 20px; }
  .bottom-row .section { flex: 1; }
  .section h2 { font-size: 12px; margin: 0 0 16px; color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar {
    width: 100%;
    background: linear-gradient(180deg, var(--aurora-1), var(--aurora-2) 70%, var(--aurora-3));
    border-radius: 3px 3px 2px 2px;
    min-height: 2px;
    box-shadow: 0 0 14px rgba(0, 255, 200, 0.35);
  }
  .bar-date { font-family: var(--font-num); font-size: 10px; color: var(--ink-soft); margin-top: 8px; white-space: nowrap; }
  .cta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    padding: 11px 2px;
    border-bottom: 1px solid var(--panel-border);
    color: var(--ink);
  }
  .cta-row:last-child { border-bottom: none; }
  .cta-row span:last-child { font-family: var(--font-num); font-weight: 700; }
  .funnel-row { padding-bottom: 0; }
  .funnel-row .funnel-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: var(--ink); }
  .funnel-row .funnel-top span:first-child { font-weight: 500; }
  .funnel-row .funnel-top span:last-child { font-family: var(--font-num); font-weight: 600; }
  .funnel-track { background: var(--track); border-radius: 999px; height: 8px; overflow: hidden; }
  .funnel-fill { height: 100%; background: linear-gradient(90deg, var(--aurora-1), var(--aurora-2), var(--aurora-3)); border-radius: 999px; box-shadow: 0 0 10px rgba(0, 255, 200, 0.35); }
  #funnelList { display: flex; flex-direction: column; gap: 18px; }
  .range { display: flex; gap: 10px; }
  .range button {
    font-family: var(--font-jp);
    background: var(--panel);
    color: var(--ink-soft);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .range button:hover { transform: translateY(-1px); }
  .range button.active {
    background: linear-gradient(120deg, var(--aurora-1), var(--aurora-2));
    color: #05060f;
    font-weight: 700;
    border-color: transparent;
    box-shadow: 0 4px 20px rgba(0, 255, 200, 0.2);
  }
  .hidden { display: none; }
  .loading, .empty { text-align: center; color: var(--ink-soft); padding: 40px 0; }
  @media (min-width: 1100px) {
    .main-row { flex-direction: row; align-items: stretch; }
    .chart-section { margin-bottom: 0; width: 728px; flex-shrink: 0; display: flex; flex-direction: column; }
    .chart-section .bars { flex: 1; }
    .right-col { flex: 1; min-width: 0; }
    .bottom-row { flex-direction: row; }
  }
  @media (max-width: 700px) {
    .wrap { padding: 28px 16px 50px; }
    .cards { flex-wrap: wrap; }
    .card { flex: 1 1 calc(50% - 12px); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="dash">
    <div class="header-bar">
      <h1>📊 LPアナリティクス</h1>
      <div class="range" id="rangeButtons"></div>
    </div>
    <div id="loading" class="loading">読み込み中…</div>
    <div id="content" class="hidden">
      <div class="cards">
        <div class="card"><div class="label">訪問者数</div><div class="value" id="v-visitors">-</div></div>
        <div class="card"><div class="label">ページ表示回数</div><div class="value" id="v-pageviews">-</div></div>
        <div class="card"><div class="label">CTAクリック数</div><div class="value" id="v-clicks">-</div></div>
        <div class="card"><div class="label">クリック率</div><div class="value" id="v-rate">-<span class="unit">%</span></div></div>
        <div class="card"><div class="label">平均滞在時間</div><div class="value" id="v-dwell">-</div></div>
        <div class="card"><div class="label">申し込み完了数</div><div class="value" id="v-conv">-</div></div>
        <div class="card"><div class="label">申し込み完了率</div><div class="value" id="v-convrate">-<span class="unit">%</span></div></div>
      </div>
      <div class="main-row">
        <div class="section chart-section">
          <h2>日別 訪問者数</h2>
          <div class="bars" id="bars"></div>
        </div>
        <div class="right-col">
          <div class="section">
            <h2>セクション到達率（ファネル）</h2>
            <div id="funnelList"></div>
          </div>
          <div class="bottom-row">
            <div class="section">
              <h2>離脱したセクション</h2>
              <div id="exitList"></div>
            </div>
            <div class="section">
              <h2>CTAボタン別クリック内訳</h2>
              <div id="ctaList"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  var FN_URL = 'https://qgcgkrcrfzonmmygcdju.supabase.co/functions/v1/lp-analytics-summary';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnY2drcmNyZnpvbm1teWdjZGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxOTY3NDcsImV4cCI6MjA5MDc3Mjc0N30.2kTAP333XfchMUpOJQB-Ex44wdj51JqjJR9nyTboBPE';
  var currentDays = 7;

  function renderRangeButtons() {
    var opts = [{ d: 7, label: '7日間' }, { d: 30, label: '30日間' }, { d: 90, label: '90日間' }];
    var el = document.getElementById('rangeButtons');
    el.innerHTML = '';
    opts.forEach(function (o) {
      var b = document.createElement('button');
      b.textContent = o.label;
      if (o.d === currentDays) b.className = 'active';
      b.onclick = function () { currentDays = o.d; load(currentDays, false); };
      el.appendChild(b);
    });
  }

  function formatDwell(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m > 0 ? (m + '分' + s + '秒') : (s + '秒');
  }

  function load(days) {
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('content').classList.add('hidden');

    fetch(FN_URL, {
      method: 'POST',
      headers: {
        'apikey': ANON,
        'Authorization': 'Bearer ' + ANON,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ days: days })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('server');
        return res.json();
      })
      .then(function (data) {
        renderRangeButtons();
        render(data);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
      })
      .catch(function () {
        document.getElementById('loading').textContent = '読み込みに失敗しました。時間をおいて再度お試しください。';
      });
  }

  renderRangeButtons();
  load(currentDays);

  function render(data) {
    document.getElementById('v-visitors').textContent = data.visitors;
    document.getElementById('v-pageviews').textContent = data.pageviews;
    document.getElementById('v-clicks').textContent = data.ctaClicks;
    document.getElementById('v-rate').innerHTML = data.clickRate + '<span class="unit">%</span>';
    document.getElementById('v-dwell').textContent = formatDwell(data.avgDwellSeconds);
    document.getElementById('v-conv').textContent = data.conversions;
    document.getElementById('v-convrate').innerHTML = data.conversionRate + '<span class="unit">%</span>';

    var bars = document.getElementById('bars');
    bars.innerHTML = '';
    var max = Math.max.apply(null, data.daily.map(function (d) { return d.pageviews; }).concat([1]));
    data.daily.forEach(function (d) {
      var col = document.createElement('div');
      col.className = 'bar-col';
      var bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = Math.max(2, Math.round((d.pageviews / max) * 100)) + '%';
      bar.title = d.date + ': ' + d.pageviews + '件';
      var label = document.createElement('div');
      label.className = 'bar-date';
      label.textContent = d.date.slice(5);
      col.appendChild(bar);
      col.appendChild(label);
      bars.appendChild(col);
    });

    var ctaList = document.getElementById('ctaList');
    ctaList.innerHTML = '';
    var entries = Object.entries(data.ctaBreakdown || {}).sort(function (a, b) { return b[1] - a[1]; });
    if (!entries.length) {
      ctaList.innerHTML = '<div class="empty">まだクリックがありません</div>';
    } else {
      entries.forEach(function (e) {
        var row = document.createElement('div');
        row.className = 'cta-row';
        row.innerHTML = '<span>' + e[0].replace(/</g, '&lt;') + '</span><span>' + e[1] + '回</span>';
        ctaList.appendChild(row);
      });
    }

    var funnelList = document.getElementById('funnelList');
    funnelList.innerHTML = '';
    var funnel = data.funnel || [];
    if (!funnel.length) {
      funnelList.innerHTML = '<div class="empty">まだデータがありません</div>';
    } else {
      var funnelMax = Math.max.apply(null, funnel.map(function (f) { return f.sessions; }).concat([1]));
      funnel.forEach(function (f) {
        var row = document.createElement('div');
        row.className = 'funnel-row';
        var pct = Math.round((f.sessions / funnelMax) * 100);
        row.innerHTML =
          '<div class="funnel-top"><span>' + f.section.replace(/</g, '&lt;') + '</span><span>' + f.sessions + '人</span></div>' +
          '<div class="funnel-track"><div class="funnel-fill" style="width:' + Math.max(2, pct) + '%"></div></div>';
        funnelList.appendChild(row);
      });
    }

    var exitList = document.getElementById('exitList');
    exitList.innerHTML = '';
    var exits = Object.entries(data.exitBreakdown || {}).sort(function (a, b) { return b[1] - a[1]; });
    if (!exits.length) {
      exitList.innerHTML = '<div class="empty">まだデータがありません</div>';
    } else {
      exits.forEach(function (e) {
        var row = document.createElement('div');
        row.className = 'cta-row';
        row.innerHTML = '<span>' + e[0].replace(/</g, '&lt;') + '</span><span>' + e[1] + '人</span>';
        exitList.appendChild(row);
      });
    }
  }
</script>
</body>
</html>
